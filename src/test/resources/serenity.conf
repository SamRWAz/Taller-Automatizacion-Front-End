serenity.project.name = "Botica Alquimista - Automatizacion Front-End Serenity Screenplay"
serenity.test.root = "features"
serenity.requirements.dir = "features"
serenity.requirements.base.dir = "src/test/resources"
serenity.outputDirectory = "target/site/serenity"
serenity.report.encoding = "UTF-8"
serenity.take.screenshots = "FOR_EACH_ACTION"
webdriver.timeouts.implicitlywait = 10000

serenity.browser = chrome

environments {
  chrome {
    webdriver {
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = [
            "--headless=new",
            "--window-size=1920,1080",
            "--enable-automation",
            "--no-sandbox",
            "--disable-dev-shm-usage",
            "--disable-popup-blocking",
            "--disable-infobars",
            "--disable-notifications",
            "--remote-allow-origins=*",
            "--ignore-certificate-errors"
          ]
        }
      }
    }
  }
}