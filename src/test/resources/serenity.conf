serenity {
  project.name = "Botica Alquimista - Automatizacion Front-End Serenity Screenplay"
  test.root = "features"
  requirements.dir = "features"
  requirements.base.dir = "src/test/resources"
  outputDirectory = "target/site/serenity"
  report.encoding = "UTF-8"
  take.screenshots = "FOR_EACH_ACTION"
  restart.browser.for.each = scenario
}

headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 15000
    fluentwait = 15000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "--headless=new",
        "--window-size=1920,1080",
        "--enable-automation",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--disable-popup-blocking",
        "--disable-notifications",
        "--remote-allow-origins=*",
        "--ignore-certificate-errors"
      ]
    }
  }
}